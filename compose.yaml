name: yiranzhu-homepage

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: yiranzhu-homepage-jekyll:local
    environment:
      JEKYLL_ENV: development
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/workspace:ro
      - site_output:/srv/jekyll/_site
      - jekyll_cache:/srv/jekyll/.jekyll-cache
      - sass_cache:/srv/jekyll/.sass-cache

volumes:
  site_output:
  jekyll_cache:
  sass_cache:
